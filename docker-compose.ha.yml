# HU-Q1: alta disponibilidad en una sola maquina: 2 Core + 2 Gateway detras de Caddy
# con verificacion de salud. Caddy entra directo a los servicios (nginx no se usa).
#
#   Local:  docker compose -f docker-compose.yml -f docker-compose.ha.yml up --build
#           -> http://localhost  (DOMAIN=localhost en el .env; sin TLS)
#   VM:     docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ha.yml up -d
#
# Prueba de disponibilidad (200 usuarios, se tumba una instancia al minuto 3):
#   bash scripts/prueba-disponibilidad.sh

services:
  core-service-2:
    build: ../alamano-core-service
    image: ghcr.io/alamano-iluminaty/alamano-core-service:latest
    container_name: alamano-core-service-2
    environment:
      HOSTNAME: core-2
      JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alamano?currentSchema=core
      SPRING_DATASOURCE_USERNAME: ${CORE_DB_USER:-core_app}
      SPRING_DATASOURCE_PASSWORD: ${CORE_DB_PASSWORD:-core_app}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-alamano}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-alamano}
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [alamano-net]

  core-service:
    environment:
      HOSTNAME: core-1

  realtime-gateway:
    environment:
      HOSTNAME: gateway-1

  realtime-gateway-2:
    build: ../alamano-realtime-gateway
    image: ghcr.io/alamano-iluminaty/alamano-realtime-gateway:latest
    container_name: alamano-realtime-gateway-2
    environment:
      HOSTNAME: gateway-2
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-alamano}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-alamano}
      JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:8080,http://localhost:5173}
    volumes:
      - ./keys:/keys:ro
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [alamano-net]

  caddy:
    build: ./caddy
    image: ghcr.io/alamano-iluminaty/alamano-caddy:latest
    container_name: alamano-caddy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CORE_UPSTREAMS: ${CORE_UPSTREAMS:-core-service:8082 core-service-2:8082}
      GATEWAY_UPSTREAMS: ${GATEWAY_UPSTREAMS:-realtime-gateway:8083 realtime-gateway-2:8083}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.ha:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth-service
      - core-service
      - core-service-2
      - realtime-gateway
      - realtime-gateway-2
      - frontend
    restart: unless-stopped
    networks: [alamano-net]

  # Con Caddy entrando directo, nginx no se usa en este modo.
  nginx:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
