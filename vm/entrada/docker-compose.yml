# VM de entrada (ver docs/topologia-4-vms.md): recibe el trafico de internet.
#
#   docker compose -f docker-compose.yml up -d
#
# Requiere .env con DOMAIN y las IPs privadas de las VMs de app (CORE_UPSTREAMS,
# GATEWAY_UPSTREAMS, AUTH_UPSTREAMS) para Caddy y Prometheus.

services:
  caddy:
    image: ghcr.io/alamano-iluminaty/alamano-caddy:latest
    pull_policy: always
    container_name: alamano-caddy
    environment:
      DOMAIN: ${DOMAIN}
      CORE_UPSTREAMS: ${CORE_UPSTREAMS}
      GATEWAY_UPSTREAMS: ${GATEWAY_UPSTREAMS}
      AUTH_UPSTREAMS: ${AUTH_UPSTREAMS}
      GRAFANA_UPSTREAM: grafana:3000
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../caddy/Caddyfile.ha:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: alamano-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: alamano-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: alamano-node-exporter
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  prom_data:
  grafana_data:
