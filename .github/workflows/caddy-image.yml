# Publica la imagen de Caddy con el plugin de rate limit en GHCR.
# Se dispara cuando cambian caddy/Dockerfile o los Caddyfile; no se corre con cada PR.
name: Caddy image

on:
  push:
    branches: [main, master]
    paths:
      - caddy/**
      - .github/workflows/caddy-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./caddy
          push: true
          tags: |
            ghcr.io/alamano-iluminaty/alamano-caddy:latest
            ghcr.io/alamano-iluminaty/alamano-caddy:${{ github.sha }}
