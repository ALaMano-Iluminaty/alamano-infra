# Publica la imagen de Caddy con el plugin de rate limit en GHCR.
# Se dispara cuando cambian caddy/Dockerfile o los Caddyfile; no se corre con cada PR.
name: Caddy image

on:
  push:
    branches: [main, master]
    paths:
      - caddy/**
      - .github/workflows/caddy-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./caddy
          push: true
          tags: |
            ghcr.io/alamano-iluminaty/alamano-caddy:latest
            ghcr.io/alamano-iluminaty/alamano-caddy:${{ github.sha }}
