# Override para la VM: Caddy adelante, saca y renueva el certificado HTTPS solo.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requiere DOMAIN en el .env, por ejemplo alamano.eastus.cloudapp.azure.com

# Memoria: Auth y Core arrancan con -XX:MaxRAMPercentage=75, que es el 75% de lo
# que el contenedor VE. Sin mem_limit cada JVM ve toda la RAM de la VM y pide el
# 75% para si sola; con tres servicios Java, la maquina se queda sin memoria.
# Con mem_limit cada JVM se dimensiona contra su propio limite.
# Los valores de abajo suman ~2.6 GB y entran de sobra en una VM de 8 GB.
# Para una de 4 GB (B2s) sirven igual; para una de 2 GB (B1ms): auth y core 448m,
# gateway 320m, postgres 256m, rabbitmq 256m, redis 96m.

services:
  # En la VM no se compila: se usan las imagenes que publico el CI al mergear.
  # Asi la VM no necesita clonar los repos de los servicios ni tener Maven.
  auth-service:
    pull_policy: always
    mem_limit: 640m
  core-service:
    pull_policy: always
    mem_limit: 640m

  realtime-gateway:
    pull_policy: always
    # Su Dockerfile fija -Xmx256m, asi que no depende de MaxRAMPercentage.
    mem_limit: 384m
    environment:
      # El navegador llega por el dominio, no por localhost: sin esto el
      # handshake del WebSocket se rechaza y el mapa nunca recibe eventos.
      ALLOWED_ORIGINS: https://${DOMAIN:?Falta DOMAIN en el .env}

  frontend:
    pull_policy: always
    # Solo nginx sirviendo estaticos.
    mem_limit: 128m

  postgres:
    mem_limit: 512m
  rabbitmq:
    mem_limit: 512m
  redis:
    mem_limit: 192m

  nginx:
    ports: !reset []          # ya no se publica: solo Caddy habla con internet

  caddy:
    image: caddy:2-alpine
    container_name: alamano-caddy
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en el .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [nginx]
    restart: unless-stopped
    networks: [alamano-net]

volumes:
  caddy_data:
  caddy_config:
