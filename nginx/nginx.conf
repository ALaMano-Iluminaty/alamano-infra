events {
  worker_connections 1024;
}

http {
  # Resolucion dinamica: si un servicio tarda en subir, nginx no muere al arrancar.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # AUTH: el controlador ya vive en /auth/**, el prefijo NO se recorta.
    location /auth/ {
      set $up http://auth-service:8081;
      proxy_pass $up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # CORE: sus rutas ya empiezan por /api, asi que tampoco se recorta.
    location /api/ {
      set $up http://core-service:8082;
      proxy_pass $up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # GATEWAY: WebSocket/STOMP crudo (sin SockJS), endpoint /ws en el 8083.
    location /ws {
      set $up http://realtime-gateway:8083;
      proxy_pass $up;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      set $up http://frontend:80;
      proxy_pass $up;
      proxy_set_header Host $host;
    }
  }
}
