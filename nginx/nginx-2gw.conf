events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # HU-Q4: 100 peticiones por minuto por IP en /auth y /api, con 429.
  limit_req_zone $binary_remote_addr zone=borde:10m rate=100r/m;
  limit_req_status 429;
  limit_req_log_level warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Dos instancias del Gateway para alta disponibilidad (HU-Q1).
  upstream gateways {
    server realtime-gateway:8083;
    server realtime-gateway-2:8083;
  }

  server {
    listen 80;

    location /auth/ {
      limit_req zone=borde burst=20 nodelay;
      set $up http://auth-service:8081;
      proxy_pass $up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
      limit_req zone=borde burst=20 nodelay;
      set $up http://core-service:8082;
      proxy_pass $up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # WebSocket load-balanced entre las 2 instancias del Gateway.
    location /ws {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      set $up http://frontend:80;
      proxy_pass $up;
      proxy_set_header Host $host;
    }
  }
}
