events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Dos instancias del Gateway para alta disponibilidad (HU-Q1).
  upstream gateways {
    server realtime-gateway:8083;
    server realtime-gateway-2:8083;
  }

  server {
    listen 80;

    location /auth/ {
      set $up http://auth-service:8081;
      proxy_pass $up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
      set $up http://core-service:8082;
      proxy_pass $up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # WebSocket load-balanced entre las 2 instancias del Gateway.
    location /ws {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      set $up http://frontend:80;
      proxy_pass $up;
      proxy_set_header Host $host;
    }
  }
}
